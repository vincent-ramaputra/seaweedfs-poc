services:
  master:
    image: chrislusf/seaweedfs:4.40 # use a remote image
    ports:
      - 9333:9333
      - 19333:19333
      - 9324:9324
    command: 'master -ip=master -ip.bind=0.0.0.0 -metricsPort=9324'
    volumes:
      - ./seaweedfs/master:/data
  volume:
    image: chrislusf/seaweedfs:4.40 # use a remote image
    ports:
      - 8080:8080
      - 18080:18080
      - 9325:9325
    command: 'volume -ip=volume -master="master:9333" -ip.bind=0.0.0.0 -port=8080 -metricsPort=9325 -dir=/data/seaweedfs/volume'
    depends_on:
      - master
    volumes:
      - ./seaweedfs/volume:/data/seaweedfs/volume
  filer:
    image: chrislusf/seaweedfs:4.40 # use a remote image
    ports:
      - 8888:8888
      - 18888:18888
      - 9326:9326
    command: 'filer -ip=filer -master="master:9333" -ip.bind=0.0.0.0 -metricsPort=9326'
    tty: true
    stdin_open: true
    depends_on:
      - master
      - volume
    volumes:
      - ./seaweedfs/filer:/data
      - ./notification.toml:/etc/seaweedfs/notification.toml
  s3:
    image: chrislusf/seaweedfs:4.40 # use a remote image
    ports:
      - 8333:8333
      - 9327:9327
    command: 's3 -filer="filer:8888" -ip.bind=0.0.0.0 -metricsPort=9327'
    depends_on:
      - master
      - volume
      - filer
  webui:
    image: chrislusf/seaweedfs:4.40
    ports:
      - 23646:23646
    command: 'admin -port=23646 -masters="master:9333" -adminUser=admin -adminPassword=admin'